<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logoipsum | Utezhan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
</head>
<body>
    <div class="nav-bar">
        <div class="nav-logo">
            <img src="./logo.png" alt="logo">
        </div>

        <div class="nav-text">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">About us</a>
        </div>

        <div class="nav-btn">
            <a href="#">Get started</a>
        </div>

    </div>

    <div class="hero">
        <div class="hero-text">
            <div class = "hero_block">
                 <div class="hero-text-main">
                <p>Grow your subscription business</p>
            </div>
    
            <div class="hero-text-secondary">
                <p>Outcome-centered products that reduche chum, optimize pricing, and grow your subscription business end-to-end</p>
            </div>
    
            <div class="hero-btn">
                <div class="hero-btn-1">
                    <a href="#">Get started</a>
                </div>
    
                <div class="hero-btn-2">
                    <a href="#">Try</a>
                </div>
            </div>
            </div>
            <div class="hero-picture">
                <img src="./hero.png" alt="hero-pic">
            </div>

        </div>

    </div>

    <div class="mail-part">
        <div class="guy-picture">
            <img src="./email_guy.png" alt="mail guy">
        </div>
        <div class="placeholder">
            <div class="email-text">
                <p>Subscription index</p>
            </div>
    
            <div class="email-label">
                <input type="text" placeholder="">
            </div>
        </div>

    </div>


</body>
</html>
